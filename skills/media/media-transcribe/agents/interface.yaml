interface:
  display_name: "Media Transcribe"
  short_description: "单项转录（含逐次授权的视频号分享链接）、RSS 下载/转录与抖音公开账号持久队列；不用于学习笔记、发布、私密内容或访问控制绕过。"
  default_prompt: "先判断输入属于单个媒体、RSS，还是抖音公开账号：单项生成一个转录 Markdown；RSS 可只下载音频或批量转录。视频号只接受一个 https://weixin.qq.com/sph/... 分享链接；先说明链接会发送给第三方 sph.litao.workers.dev，用户明确同意后添加 --allow-third-party-resolver，只临时下载一个版本，转录后清理视频和音频，最终只保留 Markdown。线上解析器因凭据、网络或协议错误不可用时，先停止并说明可选择隔离腾讯元宝路径；只有用户另行同意后才检查或安装 wechat-yuanbao 组件并添加 --allow-yuanbao-fallback，由用户在临时隔离 Chrome 中手动登录，不导出 Cookie、不修改系统代理，结束后删除该 profile。不要自动启用 qiaomu 高权限本地捕获、安装根证书或接管代理。只有当用户提供抖音账号主页并明确要求批量下载、同步或转录时，才运行 opencli doctor 检查账号枚举环境；若 OpenCLI 和 Browser Bridge 已连接则直接继续，不重复展示教程；仅在 CLI 缺失或扩展未连接时，按缺失情况提示安装 CLI（npm install -g @jackwener/opencli）、从 OpenCLI Releases 下载扩展、在 chrome://extensions 加载、登录抖音并再次运行 opencli doctor。单个抖音视频、视频号、RSS、本地音频及其他模式不要展示 OpenCLI 步骤。连接后再用持久队列顺序转录。根据系统选择 macOS/Linux 的 .venv/bin/python 或 Windows PowerShell 的 .venv\\Scripts\\python.exe；Windows 账号模式必须先确认 OpenCLI Browser Bridge 可用并已连接。输入不明确时先询问，不要猜平台。学习笔记、知识点或 Anki 请求应路由到 learning-notes-automation；不要导入导出 Cookie、代输凭据/验证码或处理私密会员内容。"
