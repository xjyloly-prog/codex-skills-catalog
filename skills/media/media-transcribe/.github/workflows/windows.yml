name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create lightweight virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements\downloaders.txt -r requirements\whisper.txt
      - name: Check PowerShell installer syntax and operational paths
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }
          .\install.ps1 -Help
          .\install.ps1 -Check -Component rss-download
          $missingVenv = Join-Path $env:RUNNER_TEMP "media-transcribe-no-venv"
          New-Item -ItemType Directory -Path $missingVenv | Out-Null
          Copy-Item .\install.ps1 $missingVenv
          New-Item -ItemType Directory -Path (Join-Path $missingVenv "requirements") | Out-Null
          Push-Location $missingVenv
          try {
            $stdout = Join-Path $env:RUNNER_TEMP "media-transcribe-no-venv.stdout"
            $stderr = Join-Path $env:RUNNER_TEMP "media-transcribe-no-venv.stderr"
            $process = Start-Process powershell -ArgumentList @(
              "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\install.ps1",
              "-Check", "-Component", "local-audio"
            ) -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $output = ((Get-Content $stdout -Raw), (Get-Content $stderr -Raw)) -join "`n"
            if ($process.ExitCode -eq 0) { throw "missing venv check unexpectedly succeeded" }
            if ($output -notmatch "install.ps1" -or $output -match "bash") {
              throw "Windows remediation command was not emitted correctly: $output"
            }
          } finally {
            Pop-Location
          }
      - name: Check Windows PowerShell 5.1 operational paths
        shell: powershell
        run: |
          .\install.ps1 -Help
          .\install.ps1 -Check -Component rss-download
          .\install.ps1 -Check -Component rss-download,local-audio
      - name: Run offline tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py" -v
      - name: Check CLI and prompt fixtures
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe .\scripts\transcribe.py --help
          .\.venv\Scripts\python.exe .\scripts\validate_evals.py
